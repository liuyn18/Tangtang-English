<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>糖糖英语乐园</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#26394d;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:22px}header,.card{background:white;border-radius:24px;padding:24px;margin-bottom:16px;box-shadow:0 5px 25px #33446609}header{display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,#e8f2ff,#fce9f1)}h1{font-size:25px;margin:0}p{line-height:1.6}small{color:#697c90}#avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#fff;display:grid;place-items:center;font-size:34px;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,select,input,textarea{font:inherit;border-radius:12px;padding:12px;border:1px solid #dce3ed}button{cursor:pointer;background:#537dbd;color:white;border:0;font-weight:600}button.alt{background:#edf2fa;color:#35577f}button.danger{background:#fbe9e9;color:#9f4141}button:disabled{opacity:.5}input,textarea,select{max-width:100%;background:white;color:inherit}textarea{width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.tile{background:#edf5ef;padding:16px;border-radius:16px}.tile b{display:block;font-size:26px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.center{text-align:center}.prompt{font-size:36px;font-weight:700;margin:30px 0}.bar{height:8px;background:#e7ebf2;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#79b59a}.good{color:#26805b}.bad{color:#b44e51}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e9edf3;overflow-wrap:anywhere}#answer{width:100%;font-size:24px;text-align:center}label{display:block;margin:8px 0} @media(max-width:500px){main{padding:12px}.card,header{padding:16px}h1{font-size:21px}td,th{padding:6px;font-size:14px}}
.history{padding:0;overflow:hidden}.history summary{display:flex;align-items:center;gap:12px;padding:20px 24px;cursor:pointer;list-style:none}.history summary::-webkit-details-marker{display:none}.history summary:focus-visible{outline:2px solid #537dbd;outline-offset:-3px}.history-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#e8f2ee;font-size:22px;flex-shrink:0}.history-heading{display:grid;gap:4px;flex:1;min-width:0}.history-heading strong{font-size:17px}.history-heading small{font-size:12px}.history-chevron{font-size:24px;color:#75869a;transition:transform .2s}.history[open] .history-chevron{transform:rotate(180deg)}.history-body{padding:0 24px 20px;border-top:1px solid #edf1f6}.history-legend{display:flex;justify-content:space-between;gap:8px;margin:16px 0;font-size:13px;font-weight:600}.history-day{display:grid;grid-template-columns:48px minmax(0,1fr) 55px;align-items:center;gap:10px;margin:13px 0;font-size:13px;font-variant-numeric:tabular-nums}.history-track{height:12px;background:#f2f5f8;border-radius:8px;overflow:hidden}.history-track i{display:block;height:100%;background:#cdd6e1;border-radius:8px;overflow:hidden}.history-track b{display:block;height:100%;background:#79b59a;border-radius:8px}.history-count{text-align:right;color:#52667d}.history-note{display:block;text-align:right;margin-top:16px}@media(max-width:500px){.history{padding:0}.history summary{padding:16px}.history-body{padding:0 16px 16px}.history-legend{flex-wrap:wrap}}.module-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.module{display:grid;text-align:left;gap:10px;padding:24px;border-radius:20px;color:#26394d}.module span{font-size:32px}.module strong{font-size:21px}.module small{font-weight:400}.word-module{background:#e5effc}.sentence-module{background:#f6e6ef}.sentence-row{padding:15px 0;border-bottom:1px solid #e9edf3;overflow-wrap:anywhere}.sentence-row p{margin:6px 0}.sentence-prompt{font-size:clamp(23px,5vw,34px);overflow-wrap:anywhere}.mic-button{width:76px;height:76px;border-radius:50%;font-size:32px}.sentence-answer{background:#edf5ef;border-radius:16px;padding:16px;overflow-wrap:anywhere}@media(max-width:500px){.module{padding:16px}.module strong{font-size:18px}}</style><main><section id="login" class="card"><h1>🌷 糖糖英语乐园</h1><p>登录后同步学习数据</p><form id="loginform"><label>邮箱 <input id="email" type="email" required autocomplete="username"></label><label>密码 <input id="password" type="password" required autocomplete="current-password"></label><button>登录</button></form><p id="loginmsg"></p></section><div id="workspace" hidden><div class="row"><small id="syncstatus">连接中</small><button class="alt" id="syncnow">同步</button><button class="alt" id="logout">退出登录</button></div><header><div id="avatar" title="上传头像">🌷</div><input type="file" id="photo" accept="image/*" hidden><div><h1>Hello, 糖糖！</h1><p style="margin:5px 0">TangTang's English World</p><small>点击头像上传自己的照片</small></div></header><nav><button class="alt" onclick="page('home')">🏡 首页</button><button class="alt" onclick="page('words')">📚 单词模块</button><button class="alt" onclick="page('sentences')">🎙️ 句子模块</button><button class="alt" onclick="page('settings')">⚙️ 设置</button></nav><section id="view"></section><small>私人学习空间 · 云端同步版 · V2.0 双模块版</small></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S={words:[],logs:[],task:null,avatar:'',sentences:[],sentenceLogs:[],sentenceTask:null,settings:{count:10,hints:false}};let current='home';function avatar(){ $('avatar').innerHTML='🌷';if(S.avatar){let im=document.createElement('img');im.src=S.avatar;im.style='width:100%;height:100%;border-radius:50%;object-fit:cover';$('avatar').replaceChildren(im)}}avatar();$('avatar').onclick=()=>$('photo').click();$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=c.height=256;let n=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-n)/2,(im.height-n)/2,n,n,0,0,256,256);S.avatar=c.toDataURL('image/jpeg',.85);avatar();save(true)};im.src=r.result};r.readAsDataURL(f)};
function speak(t){if(!('speechSynthesis'in window))return alert('当前浏览器不支持朗读');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function sayWord(id){let w=S.words.find(x=>x.id===id);if(w)speak(w.en)}function day(){return new Date().toLocaleDateString('sv-SE')}function cats(){return [...new Set(S.words.map(w=>w.cat))]}function catOptions(){return '<option value="">全部分类</option>'+cats().map(c=>`<option>${esc(c)}</option>`).join('')}let historyOpen=false;
function historyCard(){let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=d.toLocaleDateString('sv-SE'),l=S.logs.filter(x=>x.day===k);return {k,n:l.length,ok:l.filter(x=>x.ok).length}}),total=days.reduce((a,d)=>a+d.n,0),ok=days.reduce((a,d)=>a+d.ok,0),max=Math.max(1,...days.map(d=>d.n));return `<details class="card history" ${historyOpen?'open':''} ontoggle="historyOpen=this.open"><summary><span class="history-icon" aria-hidden="true">📊</span><span class="history-heading"><strong>学习记录</strong><small>最近7天 · ${total} 题 · ${total?'正确率 '+Math.round(ok/total*100)+'%':'暂无练习'}</small></span><span class="history-chevron" aria-hidden="true">⌄</span></summary><div class="history-body"><div class="history-legend"><span>每日练习量</span><small>绿色：正确 · 灰色：其他</small></div>${days.map(d=>`<div class="history-day"><span>${d.k.slice(5)}</span><div class="history-track" aria-label="练习 ${d.n} 题，正确 ${d.ok} 题"><i style="width:${d.n/max*100}%"><b style="width:${d.n?d.ok/d.n*100:0}%"></b></i></div><span class="history-count">${d.ok}/${d.n}</span></div>`).join('')}<small class="history-note">右侧数字为正确题数 / 练习题数</small></div></details>`}
function page(p){if(current==='sentenceStudy'&&p!=='sentenceStudy')stopSpeech();current=p;let v=$('view');if(p==='home'){v.innerHTML=`<div class="card"><h2>今天也来学英语吧！</h2><div class="module-grid"><button class="module word-module" onclick="page('words')"><span>📚</span><strong>单词模块</strong><small>Words · ${S.words.length} 个单词${S.task?' · 有未完成任务':''}</small></button><button class="module sentence-module" onclick="page('sentences')"><span>🎙️</span><strong>句子模块</strong><small>Sentences · ${(S.sentences||[]).length} 个句子${S.sentenceTask?' · 有未完成任务':''}</small></button></div></div>`;return}if(p==='sentences'||p==='sentenceLibrary'||p==='sentenceStudy'){sentencePage(p);return}if(p==='words'){let today=S.logs.filter(l=>l.day===day());v.innerHTML=`<div class="card"><h2>今天也来学英语吧！</h2><div class="grid"><div class="tile">我的单词<b>${S.words.length}</b></div><div class="tile">今日练习<b>${today.length}</b></div><div class="tile">待复习<b>${S.words.filter(w=>w.due&&w.due<=day()).length}</b></div><div class="tile">累计正确<b>${S.logs.filter(l=>l.ok).length}</b></div></div><p>${S.task?'你有一个尚未完成的学习任务。':'每天一点点，积累大进步。'}</p><div class="row"><button onclick="page('${S.words.length?'study':'library'}')">${S.task?'继续学习':S.words.length?'开始今日学习':'添加第一批单词'}</button><button class="alt" onclick="page('library')">我的词库</button><button class="alt" onclick="page('wrong')">错词本</button></div></div>${historyCard()}`}else if(p==='library'){v.innerHTML=`<div class="card"><h2>我的词库</h2><form id="add"><div class="row"><input id="en" required placeholder="英文单词"><input id="cn" required placeholder="中文释义"><input id="cat" placeholder="分类（如 Unit 1）"><button>添加</button></div></form><h3>批量导入</h3><small>支持 Excel .xlsx、CSV 或直接粘贴 Excel 的三列：英文、中文、分类。</small><div class="row"><input type="file" id="file" accept=".xlsx,.csv,.tsv,.txt"><button class="alt" onclick="template()">下载模板</button></div><textarea id="paste" rows="3" placeholder="apple\t苹果\t水果"></textarea><button onclick="importText($('paste').value)">导入粘贴内容</button></div><div class="card"><div class="row"><input id="search" placeholder="搜索单词" oninput="list()"><select id="filter" onchange="list()">${catOptions()}</select></div><div id="list"></div></div>`;$('add').onsubmit=e=>{e.preventDefault();if(add($('en').value,$('cn').value,$('cat').value)){save();page('library')}else alert('内容为空或单词已存在')};$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(/\.xlsx$/i.test(f.name)){if(!window.XLSX)throw Error('Excel组件未加载，请使用CSV或粘贴');let b=XLSX.read(await f.arrayBuffer());importRows(XLSX.utils.sheet_to_json(b.Sheets[b.SheetNames[0]],{header:1,defval:''}))}else importText(await f.text())}catch(e){alert(e.message)}};list()}else if(p==='study'){if(S.task){renderTask();return}v.innerHTML=`<div class="card"><h2>选择学习方式</h2><label>学习分类 <select id="studycat">${catOptions()}</select></label><label>题量 <input id="count" type="number" min="1" max="100" value="${S.settings.count}"></label><div class="row"><button onclick="start('spell')">单词拼写</button><button onclick="start('recognize')">单词认读</button><button onclick="start('listen')">听音拼写</button><button class="alt" onclick="start('review')">到期复习</button></div><small>完成固定题量后结束，学习进度自动保存。</small></div>`}else if(p==='wrong'){let a=S.words.filter(w=>w.wrong);v.innerHTML=`<div class="card"><h2>错词本（${a.length}）</h2><button onclick="start('wrong')">专项拼写</button>${a.map(w=>`<p>${esc(w.en)} · ${esc(w.cn)}　错误 ${w.wrong} 次 <button class="alt" onclick="sayWord('${w.id}')">🔊</button></p>`).join('')||'<p>暂无错词。</p>'}</div>`}else{v.innerHTML=`<div class="card"><h2>学习设置</h2><label>默认题量 <input type="number" id="defaultCount" min="1" max="100" value="${S.settings.count}"></label><label><input type="checkbox" id="hints" ${S.settings.hints?'checked':''}> 默认显示字母数量</label><button onclick="S.settings.count=Math.max(1,Math.min(100,Number($('defaultCount').value)||10));S.settings.hints=$('hints').checked;save();alert('已保存')">保存设置</button><h3>数据备份</h3><button class="alt" onclick="download('tangtang-backup.json',JSON.stringify(S))">导出全部数据</button><label>恢复备份（替换当前学习数据）<input type="file" id="backup" accept=".json"></label><small>学习数据同步到云端，建议定期导出备份。</small></div>`;$('backup').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a.words)||!Array.isArray(a.logs)||!a.settings||!a.words.every(w=>typeof w.en==='string'&&typeof w.cn==='string'&&/^[a-z0-9-]+$/i.test(w.id)))throw Error('无效备份');if(confirm('确认替换当前数据？')){S={...blank(),...a};save();avatar();page('home')}}catch(e){alert(e.message)}}}}
let recognition=null,spoken='',voiceMessage='',voiceToken=0;
function stopSpeech(){voiceToken++;if(recognition){try{recognition.abort()}catch{}recognition=null}spoken='';voiceMessage=''}
function sentenceData(){S.sentences??=[];S.sentenceLogs??=[];return S.sentences}
function sentencePage(p){let a=sentenceData(),v=$('view');if(p==='sentences'){let today=S.sentenceLogs.filter(x=>x.day===day());v.innerHTML=`<div class="card"><h2>🎙️ 句子模块</h2><div class="grid"><div class="tile">我的句子<b>${a.length}</b></div><div class="tile">今日复述<b>${today.length}</b></div><div class="tile">累计复述<b>${S.sentenceLogs.length}</b></div></div><div class="row"><button onclick="page('sentenceStudy')">${S.sentenceTask?'继续复述':'开始复述'}</button><button class="alt" onclick="page('sentenceLibrary')">我的句库</button></div></div>`;return}
if(p==='sentenceLibrary'){v.innerHTML=`<div class="card"><h2>我的句库</h2><form id="sentenceAdd"><label>英文句子<textarea id="senEn" required rows="2" placeholder="I like playing basketball."></textarea></label><label>中文意思<textarea id="senCn" required rows="2" placeholder="我喜欢打篮球。"></textarea></label><label>分类（选填）<input id="senCat" placeholder="Unit 1"></label><button>添加句子</button></form><h3>批量录入</h3><small>从 Excel 复制英文、中文、分类三列，粘贴到下方。</small><textarea id="senPaste" rows="4" placeholder="每行一个句子，列之间用制表符分隔"></textarea><button class="alt" onclick="importSentences()">批量添加</button></div><div class="card"><h3>全部句子（${a.length}）</h3>${a.map((w,i)=>`<div class="sentence-row"><strong>${esc(w.en)}</strong><p>${esc(w.cn)}</p><small>${esc(w.cat)}</small><div class="row"><button class="alt" onclick="saySentence(${i})">🔊 朗读</button><button class="alt" onclick="editSentence(${i})">编辑</button><button class="danger" onclick="deleteSentence(${i})">删除</button></div></div>`).join('')||'<p>暂无句子，请先录入。</p>'}</div>`;$('sentenceAdd').onsubmit=e=>{e.preventDefault();if(addSentence($('senEn').value,$('senCn').value,$('senCat').value)){save();page('sentenceLibrary')}else alert('句子为空或已存在')};return}
if(!S.sentenceTask){v.innerHTML=`<div class="card"><h2>句子复述</h2><label>分类<select id="senFilter"><option value="">全部分类</option>${[...new Set(a.map(w=>w.cat))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>本组句子数量 <input id="senCount" type="number" min="1" max="100" value="5"></label><button onclick="startSentences()">开始语音复述</button><p><small>只需根据中文提示说出英文，无需打字。语音识别由浏览器提供，可能发送音频至其服务；本站不保存录音。也可自行核对答案。</small></p></div>`;return}
renderSentenceTask()}
function addSentence(en,cn,cat){en=String(en||'').trim();cn=String(cn||'').trim();cat=String(cat||'').trim()||'未分类';if(!en||!cn||sentenceData().some(w=>w.en===en&&w.cn===cn&&w.cat===cat))return false;S.sentences.push({id:crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2),en,cn,cat});return true}
function importSentences(){let n=0;for(let line of $('senPaste').value.split(/\r?\n/)){let [en,cn,cat]=line.split('\t');if(/^(英文|英文句子|english)$/i.test((en||'').trim()))continue;if(addSentence(en,cn,cat))n++}save();page('sentenceLibrary');alert('已添加 '+n+' 个句子')}
function saySentence(i){let w=sentenceData()[i];if(w)speak(w.en)}
function editSentence(i){let w=sentenceData()[i];if(!w)return;let en=prompt('英文句子',w.en);if(en===null)return;let cn=prompt('中文意思',w.cn);if(cn===null)return;let cat=prompt('分类',w.cat);if(cat===null||!en.trim()||!cn.trim())return;Object.assign(w,{en:en.trim(),cn:cn.trim(),cat:cat.trim()||'未分类'});save();page('sentenceLibrary')}
function deleteSentence(i){let w=sentenceData()[i];if(!w||!confirm('删除此句子？'))return;if(S.sentenceTask?.ids.includes(w.id)){alert('该句子正在学习任务中，请先完成或结束任务。');return}S.sentences.splice(i,1);save();page('sentenceLibrary')}
function startSentences(){let cat=$('senFilter').value,n=Math.max(1,Math.min(100,Number($('senCount').value)||5)),a=sentenceData().filter(w=>!cat||cat===w.cat);if(!a.length)return alert('请先添加句子');for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S.sentenceTask={ids:a.slice(0,n).map(w=>w.id),i:0,correct:0,preview:'ask',revealed:false};save();renderSentenceTask()}
function sentencePreview(stage){if(!S.sentenceTask)return;S.sentenceTask.preview=stage;save();renderSentenceTask()}
function currentSentence(){return sentenceData().find(w=>w.id===S.sentenceTask?.ids[S.sentenceTask.i])}
function renderSentenceTask(){let t=S.sentenceTask,w=currentSentence();if(!t||!w){S.sentenceTask=null;save();sentencePage('sentenceStudy');return}let v=$('view');if(t.preview==='ask'||t.preview==='list'){v.innerHTML=t.preview==='ask'?`<div class="card center"><h2>是否需要熟悉这组句子？</h2><p>本组共 ${t.ids.length} 个句子</p><div class="row"><button onclick="sentencePreview('list')">是，先熟悉</button><button class="alt" onclick="sentencePreview('done')">否，直接开始</button></div><button class="alt" onclick="page('sentences')">稍后继续</button></div>`:`<div class="card"><h2>先熟悉这组句子</h2>${t.ids.map(id=>sentenceData().find(x=>x.id===id)).filter(Boolean).map(x=>`<div class="sentence-row"><strong>${esc(x.en)}</strong><p>${esc(x.cn)}</p><button class="alt" onclick="saySentence(${sentenceData().indexOf(x)})">🔊 朗读</button></div>`).join('')}<button onclick="sentencePreview('done')">熟悉完成，开始复述</button></div>`;return}
v.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><b>句子复述</b><small>${t.i+1} / ${t.ids.length}</small></div><div class="bar"><i style="width:${t.i/t.ids.length*100}%"></i></div><div class="center"><p>请用英语说出下面的句子</p><div class="prompt sentence-prompt">${esc(w.cn)}</div>${!t.revealed?`<p><small>点击麦克风即同意使用浏览器语音识别服务；不保存录音。</small></p><button class="mic-button" id="mic" onclick="startSpeech()" aria-label="开始语音识别">🎙️</button><p id="voiceStatus" role="status">${esc(voiceMessage||'点击麦克风开始复述')}</p><p id="spokenText">${esc(spoken)}</p><div class="row" style="justify-content:center"><button class="alt" onclick="finishSpeech()">结束识别</button><button onclick="revealSentence()">查看英文答案</button></div>`:`<div class="sentence-answer"><small>参考答案</small><h2>${esc(w.en)}</h2><button class="alt" onclick="sayCurrentSentence()">🔊 标准朗读</button>${spoken?`<p>识别结果：${esc(spoken)}</p><small>${normalizeSpeech(spoken)===normalizeSpeech(w.en)?'识别文字与参考答案一致':'识别文字与参考答案不同，请自行核对；这不是发音评分。'}</small>`:''}</div><p>你刚才复述得怎么样？</p><div class="row" style="justify-content:center"><button onclick="gradeSentence(true)">复述正确</button><button class="alt" onclick="gradeSentence(false)">还需练习</button><button class="alt" onclick="retrySentence()">再说一次</button></div>`}</div><hr><button class="alt" onclick="page('sentences')">稍后继续</button> <button class="alt" onclick="endSentences()">结束任务</button></div>`}
function normalizeSpeech(t){return String(t).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9']/g,' ').replace(/\s+/g,' ').trim()}
function startSpeech(){if(recognition)return;let API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){voiceMessage='此浏览器不支持语音识别，请直接口头复述后查看答案，或换用支持的浏览器。';renderSentenceTask();return}let token=++voiceToken;spoken='';voiceMessage='正在启动麦克风…';renderSentenceTask();try{let rec=new API();recognition=rec;rec.lang='en-US';rec.interimResults=true;rec.continuous=false;rec.onstart=()=>{if(token===voiceToken&&$('voiceStatus'))$('voiceStatus').textContent='正在聆听，请说英语…'};rec.onresult=e=>{if(token!==voiceToken)return;spoken=Array.from(e.results).map(x=>x[0].transcript).join(' ');if($('spokenText'))$('spokenText').textContent=spoken};rec.onerror=e=>{if(token!==voiceToken)return;voiceMessage='语音识别未成功（'+e.error+'），可重试或自行口头复述后核对。';if($('voiceStatus'))$('voiceStatus').textContent=voiceMessage};rec.onend=()=>{if(token!==voiceToken)return;recognition=null;if($('voiceStatus'))$('voiceStatus').textContent=spoken?'识别完成，可以查看答案或重试。':voiceMessage==='正在启动麦克风…'?'未识别到语音，请重试。':voiceMessage};rec.start()}catch(e){recognition=null;voiceMessage='无法启动麦克风，请检查权限或自行核对。';renderSentenceTask()}}
function finishSpeech(){if(recognition)try{recognition.stop()}catch{}}
function sayCurrentSentence(){let w=currentSentence();if(w)speak(w.en)}
function revealSentence(){if(recognition){let rec=recognition;recognition=null;voiceToken++;try{rec.abort()}catch{}}if(!S.sentenceTask)return;S.sentenceTask.revealed=true;save();renderSentenceTask()}
function retrySentence(){stopSpeech();S.sentenceTask.revealed=false;save();renderSentenceTask()}
function endSentences(){if(confirm('结束当前句子任务？已完成记录保留。')){stopSpeech();S.sentenceTask=null;save();page('sentences')}}
function gradeSentence(ok){let t=S.sentenceTask,w=currentSentence();if(!t?.revealed||!w)return;S.sentenceLogs.push({day:day(),id:w.id,ok});if(ok)t.correct++;t.i++;t.revealed=false;stopSpeech();if(t.i>=t.ids.length){let n=t.ids.length,k=t.correct;S.sentenceTask=null;save();$('view').innerHTML=`<div class="card center"><h1>🌟 Great job!</h1><p>句子复述任务已完成</p><div class="prompt">${k} / ${n}</div><p>自评复述正确数</p><button onclick="page('sentences')">返回句子模块</button></div>`}else{save();renderSentenceTask()}}
function add(en,cn,cat){en=String(en).trim();cn=String(cn).trim();cat=String(cat||'未分类').trim()||'未分类';if(!en||!cn||S.words.some(w=>w.en.toLowerCase()===en.toLowerCase()&&w.cn===cn&&w.cat===cat))return false;S.words.push({id:crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2),en,cn,cat,wrong:0,level:0,due:'',spell:0,recognize:0});return true}function importRows(rows){let n=0;for(let r of rows){if(!r||/^(英文|英文单词|english|word)$/i.test(String(r[0]).trim()))continue;if(add(r[0]??'',r[1]??'',r[2]??''))n++}save();page('library');alert('成功导入 '+n+' 个单词，空白或重复项已跳过')}function importText(t){let rows=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()).map(x=>x.includes('\t')?x.split('\t'):x.split(','));importRows(rows)}function download(name,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function template(){download('单词导入模板.csv','\uFEFF英文单词,中文释义,分类\napple,苹果,水果\n')}
function list(){let q=$('search').value.toLowerCase(),c=$('filter').value,a=S.words.filter(w=>(!c||c===w.cat)&&(w.en.toLowerCase().includes(q)||w.cn.includes(q)));$('list').innerHTML=`<p>共 ${a.length} 个单词</p><table><thead><tr><th>英文</th><th>中文 / 分类</th><th>操作</th></tr></thead><tbody>${a.map(w=>`<tr><td>${esc(w.en)}</td><td>${esc(w.cn)}<br><small>${esc(w.cat)}</small></td><td><button class="alt" onclick="sayWord('${w.id}')">🔊</button> <button class="alt" onclick="edit('${w.id}')">编辑</button> <button class="danger" onclick="removeWord('${w.id}')">删除</button></td></tr>`).join('')}</tbody></table>`}function edit(id){let w=S.words.find(x=>x.id===id),en=prompt('英文',w.en);if(en===null)return;let cn=prompt('中文',w.cn);if(cn===null)return;let cat=prompt('分类',w.cat);if(cat===null||!en.trim()||!cn.trim())return;Object.assign(w,{en:en.trim(),cn:cn.trim(),cat:cat.trim()||'未分类'});save();page('library')}function removeWord(id){if(confirm('删除此单词？')){S.words=S.words.filter(w=>w.id!==id);if(S.task?.ids.includes(id))S.task=null;save();page('library')}}
function start(mode){if(S.task&&!confirm('已有未完成任务，是否替换？'))return;let c=$('studycat')?.value||'',n=Math.max(1,Math.min(100,Number($('count')?.value)||S.settings.count)),a=S.words.filter(w=>(!c||w.cat===c)&&(mode!=='wrong'||w.wrong>0)&&(mode!=='review'||(w.due&&w.due<=day())));if(!a.length)return alert('没有符合条件的单词，请先导入或选择其他模式。');for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S.task={mode,ids:a.slice(0,n).map(w=>w.id),i:0,correct:0,result:null,reveal:false,preview:mode==='recognize'?'done':'ask'};save();page('study')}
function setPreview(stage){if(!S.task||!['ask','list'].includes(S.task.preview))return;S.task.preview=stage;save();renderTask()}
function renderPreview(t){let rows=t.ids.map(id=>S.words.find(w=>w.id===id)).filter(Boolean);$('view').innerHTML=t.preview==='ask'?`<div class="card center"><h2>是否需要熟悉这组单词？</h2><p>本组共 ${rows.length} 个单词</p><p>可以先看一遍单词和中文释义，再开始拼写。</p><div class="row" style="justify-content:center"><button onclick="setPreview('list')">是，先熟悉单词</button><button class="alt" onclick="setPreview('done')">否，直接开始拼写</button></div><button class="alt" onclick="page('home')">稍后继续</button></div>`:`<div class="card"><h2>先熟悉这组单词</h2><p>共 ${rows.length} 个单词，熟悉后点击开始拼写。</p><table><thead><tr><th>序号</th><th>英文单词</th><th>中文释义</th><th>发音</th></tr></thead><tbody>${rows.map((w,i)=>`<tr><td>${i+1}</td><td><b>${esc(w.en)}</b></td><td>${esc(w.cn)}</td><td><button class="alt" aria-label="播放发音" onclick="sayWord('${w.id}')">🔊</button></td></tr>`).join('')}</tbody></table><div class="row"><button onclick="setPreview('done')">熟悉完成，开始拼写</button><button class="alt" onclick="page('home')">稍后继续</button></div></div>`}
function renderTask(){let t=S.task;if(t&&t.mode!=='recognize'&&!t.preview&&t.i===0&&!t.result){t.preview='ask';save()}if(t&&['ask','list'].includes(t.preview)){renderPreview(t);return}let w=S.words.find(w=>w.id===t.ids[t.i]);if(!w){S.task=null;save();page('study');return}let rec=t.mode==='recognize',listen=t.mode==='listen';$('view').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><b>${rec?'单词认读':listen?'听音拼写':'单词拼写'}</b><small>${t.i+1} / ${t.ids.length}</small></div><div class="bar"><i style="width:${t.i/t.ids.length*100}%"></i></div><div class="center"><p>${rec?'回忆中文意思':listen?'听发音，写出英文':'根据中文写出英文'}</p><div class="prompt">${rec?esc(w.en):listen?'🎧':esc(w.cn)}</div>${rec||listen?`<button class="alt" onclick="sayWord('${w.id}')">🔊 播放发音</button>`:''}${!rec&&S.settings.hints?`<p>${w.en.length} 个字符</p>`:''}</div>${rec?(t.reveal?`<div class="center"><h2>${esc(w.cn)}</h2><div class="row" style="justify-content:center"><button class="danger" onclick="grade(false,0)">忘记</button><button class="alt" onclick="grade(false,1)">模糊</button><button onclick="grade(true,2)">认识</button></div></div>`:'<button onclick="S.task.reveal=true;save();renderTask()">显示释义</button>'):(t.result?`<div class="center"><h2 class="${t.result.ok?'good':'bad'}">${t.result.ok?'Excellent! 拼写正确':'正确答案：'+esc(w.en)}</h2><p>你的答案：${esc(t.result.answer)}</p><button class="alt" onclick="sayWord('${w.id}')">🔊 朗读</button></div>${t.result.ok?'<button id="next" onclick="next()">下一题</button>':'<form id="retry"><p>请正确拼写一次后继续</p><input id="answer" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" required><button>继续</button></form>'}`:`<form id="quiz"><input id="answer" placeholder="输入英文单词" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" required><div class="row"><button>检查答案</button><button type="button" class="alt" onclick="showHint()">提示</button></div><p id="hint"></p></form>`)}<hr style="border:0;border-top:1px solid #eee"><button class="alt" onclick="page('home')">稍后继续</button> <button class="alt" onclick="if(confirm('结束当前任务？已完成题目仍保留。')){S.task=null;save();page('study')}">结束任务</button></div>`;if($('quiz')){$('quiz').onsubmit=e=>{e.preventDefault();let a=$('answer').value.trim();grade(a.toLowerCase()===w.en.toLowerCase(),null,a)};$('answer').focus()}if($('retry')){$('retry').onsubmit=e=>{e.preventDefault();if($('answer').value.trim().toLowerCase()===w.en.toLowerCase())next();else alert('再试一次：'+w.en)};$('answer').focus()}$('next')?.focus()}
function showHint(){let w=S.words.find(w=>w.id===S.task.ids[S.task.i]);$('hint').textContent=w.en[0]+' '+ '· '.repeat(Math.max(0,w.en.length-1))}function grade(ok,r,a=''){let t=S.task;if(!t||t.result)return;let w=S.words.find(w=>w.id===t.ids[t.i]);S.logs.push({day:day(),id:w.id,ok,mode:t.mode});if(ok){t.correct++;w.level=Math.min(6,(w.level||0)+1)}else{w.wrong=(w.wrong||0)+1;w.level=0}let d=new Date();d.setDate(d.getDate()+(ok?[1,1,2,4,7,15,30][w.level]:1));w.due=d.toLocaleDateString('sv-SE');if(t.mode==='recognize'){w.recognize=(w.recognize||0)+(ok?1:0);next()}else{w.spell=(w.spell||0)+(ok?1:0);t.result={ok,answer:a};save();renderTask()}}function next(){let t=S.task;t.i++;t.result=null;t.reveal=false;if(t.i>=t.ids.length){let n=t.ids.length,c=t.correct;S.task=null;save();$('view').innerHTML=`<div class="card center"><h1>🌟 Great job!</h1><p>本次任务已完成</p><div class="prompt">${c} / ${n}</div><p>正确率 ${Math.round(c/n*100)}%</p><button onclick="page('home')">返回首页</button> <button class="alt" onclick="page('study')">新任务</button></div>`}else{save();renderTask()}}page('home');
const cloud=window.supabase.createClient('https://xqtjggjydoxwtgaquvmh.supabase.co','sb_publishable_UG7MvM_drG3MkkcGJ-lIDQ_nwpNs0hv');
let uid=null,version=null,dirty=false,busy=false,conflict=false,timer=null,ready=false;

function payload(){return {user_id:uid,profile:{avatar:S.avatar},words:S.words,learning_records:S.logs,mistakes:[],active_task:S.task||{},settings:{...S.settings,sentenceModule:{sentences:S.sentences||[],logs:S.sentenceLogs||[],task:S.sentenceTask||null}},updated_at:new Date().toISOString()}}
function remoteState(r){let {sentenceModule:m,...settings}=r.settings||{};return {...blank(),words:r.words||[],logs:r.learning_records||[],task:r.active_task?.ids?r.active_task:null,avatar:r.profile?.avatar||'',settings:{...blank().settings,...settings},sentences:Array.isArray(m?.sentences)?m.sentences:[],sentenceLogs:Array.isArray(m?.logs)?m.logs:[],sentenceTask:m?.task?.ids?m.task:null}}let deferredRemote=null;function apply(r){if(current==='sentenceStudy')stopSpeech();S=remoteState(r);version=r.updated_at;deferredRemote=null;avatar();page(current);}

function canonical(v){if(Array.isArray(v))return v.map(canonical);if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])]));return v}function sameLearning(r){let remote=remoteState(r);let parts=s=>[s.words,s.logs,s.task,s.settings,s.sentences||[],s.sentenceLogs||[],s.sentenceTask||null];return JSON.stringify(canonical(parts(S)))===JSON.stringify(canonical(parts(remote)))}
async function pull(force=false){if(!uid||!ready||busy||dirty||conflict)return;busy=true;try{const {data,error}=await cloud.from('tangtang_learning').select('*').eq('user_id',uid).maybeSingle();if(error)throw error;if(dirty)return;if(data&&data.updated_at!==version){if(sameLearning(data)){S.avatar=data.profile?.avatar||'';version=data.updated_at;deferredRemote=null;avatar()}else if(!force&&editing()){deferredRemote=data;S.avatar=data.profile?.avatar||'';avatar();status('头像已更新；学习数据待安全刷新');return}else apply(data)}status('已同步');}catch(e){status('读取失败：'+e.message)}finally{busy=false;if(dirty&&!conflict){clearTimeout(timer);timer=setTimeout(flush,150)}}}
function save(immediate=false){if(!ready)return;dirty=true;try{localStorage.setItem('tt-pending-'+uid,JSON.stringify({state:S,version}))}catch{}status('正在保存…');clearTimeout(timer);if(immediate)void flush();else timer=setTimeout(flush,150)}

async function enter(user){uid=user.id;ready=false;dirty=false;conflict=false;version=null;deferredRemote=null;S=blank();$('login').hidden=true;$('workspace').hidden=false;$('workspace').inert=true;status('读取云端…');try{let {data,error}=await cloud.from('tangtang_learning').select('*').eq('user_id',uid).maybeSingle();if(error)throw error;let pending;try{pending=JSON.parse(localStorage.getItem('tt-pending-'+uid))}catch{}if(data)apply(data);else {let old;try{old=JSON.parse(localStorage.getItem('ttwords-v1'))}catch{}if(old&&confirm('是否将此浏览器旧版学习数据导入云端？'))S={...blank(),...old};avatar();page('home')}ready=true;$('workspace').inert=false;if(pending){if(pending.version===version){S={...blank(),...pending.state};avatar();page(current);save()}else{download('未同步学习备份.json',JSON.stringify(pending.state));localStorage.removeItem('tt-pending-'+uid);alert('旧的未同步数据已导出备份，保留云端版本。')}}else if(!data)save();else status('已同步')}catch(e){$('login').hidden=false;$('workspace').hidden=true;$('loginmsg').textContent='读取失败：'+e.message;uid=null}}
