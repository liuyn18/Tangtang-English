</style><main><section id="login" class="card"><h1>🌷 糖糖单词乐园</h1><p>登录后同步学习数据</p><form id="loginform"><label>邮箱 <input id="email" type="email" required autocomplete="username"></label><label>密码 <input id="password" type="password" required autocomplete="current-password"></label><button>登录</button></form><p id="loginmsg"></p></section><div id="workspace" hidden><div class="row"><small id="syncstatus">连接中</small><button class="alt" id="syncnow">同步</button><button class="alt" id="logout">退出登录</button></div><header><div id="avatar" title="上传头像">🌷</div><input type="file" id="photo" accept="image/*" hidden><div><h1>Hello, 糖糖！</h1><p style="margin:5px 0">TangTang's Word World</p><small>点击头像上传自己的照片</small></div></header><nav><button onclick="page('home')">🏡 首页</button><button class="alt" onclick="page('library')">📚 我的词库</button><button class="alt" onclick="page('study')">✏️ 开始学习</button><button class="alt" onclick="page('wrong')">🌱 错词本</button><button class="alt" onclick="page('settings')">⚙️ 设置</button></nav><section id="view"></section><small>私人学习空间 · 云端同步版</small></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S={words:[],logs:[],task:null,avatar:'',settings:{count:10,hints:false}};let current='home';function avatar(){ $('avatar').innerHTML='🌷';if(S.avatar){let im=document.createElement('img');im.src=S.avatar;im.style='width:100%;height:100%;border-radius:50%;object-fit:cover';$('avatar').replaceChildren(im)}}avatar();$('avatar').onclick=()=>$('photo').click();$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=c.height=256;let n=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-n)/2,(im.height-n)/2,n,n,0,0,256,256);S.avatar=c.toDataURL('image/jpeg',.85);avatar();save(true)};im.src=r.result};r.readAsDataURL(f)};
function speak(t){if(!('speechSynthesis'in window))return alert('当前浏览器不支持朗读');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function sayWord(id){let w=S.words.find(x=>x.id===id);if(w)speak(w.en)}function day(){return new Date().toLocaleDateString('sv-SE')}function cats(){return [...new Set(S.words.map(w=>w.cat))]}function catOptions(){return '<option value="">全部分类</option>'+cats().map(c=>`<option>${esc(c)}</option>`).join('')}function page(p){current=p;let v=$('view');if(p==='home'){let today=S.logs.filter(l=>l.day===day());v.innerHTML=`<div class="card"><h2>今天也来学英语吧！</h2><div class="grid"><div class="tile">我的单词<b>${S.words.length}</b></div><div class="tile">今日练习<b>${today.length}</b></div><div class="tile">待复习<b>${S.words.filter(w=>w.due&&w.due<=day()).length}</b></div><div class="tile">累计正确<b>${S.logs.filter(l=>l.ok).length}</b></div></div><p>${S.task?'你有一个尚未完成的学习任务。':'每天一点点，积累大进步。'}</p><button onclick="page('${S.words.length?'study':'library'}')">${S.task?'继续学习':S.words.length?'开始今日学习':'添加第一批单词'}</button></div><div class="card"><h3>学习记录（最近7天）</h3>${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=d.toLocaleDateString('sv-SE'),l=S.logs.filter(x=>x.day===k);return `<p>${k.slice(5)}　${l.length}题　正确 ${l.filter(x=>x.ok).length}题</p>`}).join('')}</div>`}else if(p==='library'){v.innerHTML=`<div class="card"><h2>我的词库</h2><form id="add"><div class="row"><input id="en" required placeholder="英文单词"><input id="cn" required placeholder="中文释义"><input id="cat" placeholder="分类（如 Unit 1）"><button>添加</button></div></form><h3>批量导入</h3><small>支持 Excel .xlsx、CSV 或直接粘贴 Excel 的三列：英文、中文、分类。</small><div class="row"><input type="file" id="file" accept=".xlsx,.csv,.tsv,.txt"><button class="alt" onclick="template()">下载模板</button></div><textarea id="paste" rows="3" placeholder="apple\t苹果\t水果"></textarea><button onclick="importText($('paste').value)">导入粘贴内容</button></div><div class="card"><div class="row"><input id="search" placeholder="搜索单词" oninput="list()"><select id="filter" onchange="list()">${catOptions()}</select></div><div id="list"></div></div>`;$('add').onsubmit=e=>{e.preventDefault();if(add($('en').value,$('cn').value,$('cat').value)){save();page('library')}else alert('内容为空或单词已存在')};$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(/\.xlsx$/i.test(f.name)){if(!window.XLSX)throw Error('Excel组件未加载，请使用CSV或粘贴');let b=XLSX.read(await f.arrayBuffer());importRows(XLSX.utils.sheet_to_json(b.Sheets[b.SheetNames[0]],{header:1,defval:''}))}else importText(await f.text())}catch(e){alert(e.message)}};list()}else if(p==='study'){if(S.task){renderTask();return}v.innerHTML=`<div class="card"><h2>选择学习方式</h2><label>学习分类 <select id="studycat">${catOptions()}</select></label><label>题量 <input id="count" type="number" min="1" max="100" value="${S.settings.count}"></label><div class="row"><button onclick="start('spell')">单词拼写</button><button onclick="start('recognize')">单词认读</button><button onclick="start('listen')">听音拼写</button><button class="alt" onclick="start('review')">到期复习</button></div><small>完成固定题量后结束，学习进度自动保存。</small></div>`}else if(p==='wrong'){let a=S.words.filter(w=>w.wrong);v.innerHTML=`<div class="card"><h2>错词本（${a.length}）</h2><button onclick="start('wrong')">专项拼写</button>${a.map(w=>`<p>${esc(w.en)} · ${esc(w.cn)}　错误 ${w.wrong} 次 <button class="alt" onclick="sayWord('${w.id}')">🔊</button></p>`).join('')||'<p>暂无错词。</p>'}</div>`}else{v.innerHTML=`<div class="card"><h2>学习设置</h2><label>默认题量 <input type="number" id="defaultCount" min="1" max="100" value="${S.settings.count}"></label><label><input type="checkbox" id="hints" ${S.settings.hints?'checked':''}> 默认显示字母数量</label><button onclick="S.settings.count=Math.max(1,Math.min(100,Number($('defaultCount').value)||10));S.settings.hints=$('hints').checked;save();alert('已保存')">保存设置</button><h3>数据备份</h3><button class="alt" onclick="download('tangtang-backup.json',JSON.stringify(S))">导出全部数据</button><label>恢复备份（替换当前学习数据）<input type="file" id="backup" accept=".json"></label><small>学习数据同步到云端，建议定期导出备份。</small></div>`;$('backup').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a.words)||!Array.isArray(a.logs)||!a.settings||!a.words.every(w=>typeof w.en==='string'&&typeof w.cn==='string'&&/^[a-z0-9-]+$/i.test(w.id)))throw Error('无效备份');if(confirm('确认替换当前数据？')){S=a;save();avatar();page('home')}}catch(e){alert(e.message)}}}}
function add(en,cn,cat){en=String(en).trim();cn=String(cn).trim();cat=String(cat||'未分类').trim()||'未分类';if(!en||!cn||S.words.some(w=>w.en.toLowerCase()===en.toLowerCase()&&w.cn===cn&&w.cat===cat))return false;S.words.push({id:crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2),en,cn,cat,wrong:0,level:0,due:'',spell:0,recognize:0});return true}function importRows(rows){let n=0;for(let r of rows){if(!r||/^(英文|英文单词|english|word)$/i.test(String(r[0]).trim()))continue;if(add(r[0]??'',r[1]??'',r[2]??''))n++}save();page('library');alert('成功导入 '+n+' 个单词，空白或重复项已跳过')}function importText(t){let rows=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()).map(x=>x.includes('\t')?x.split('\t'):x.split(','));importRows(rows)}function download(name,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function template(){download('单词导入模板.csv','\uFEFF英文单词,中文释义,分类\napple,苹果,水果\n')}
function list(){let q=$('search').value.toLowerCase(),c=$('filter').value,a=S.words.filter(w=>(!c||c===w.cat)&&(w.en.toLowerCase().includes(q)||w.cn.includes(q)));$('list').innerHTML=`<p>共 ${a.length} 个单词</p><table><thead><tr><th>英文</th><th>中文 / 分类</th><th>操作</th></tr></thead><tbody>${a.map(w=>`<tr><td>${esc(w.en)}</td><td>${esc(w.cn)}<br><small>${esc(w.cat)}</small></td><td><button class="alt" onclick="sayWord('${w.id}')">🔊</button> <button class="alt" onclick="edit('${w.id}')">编辑</button> <button class="danger" onclick="removeWord('${w.id}')">删除</button></td></tr>`).join('')}</tbody></table>`}function edit(id){let w=S.words.find(x=>x.id===id),en=prompt('英文',w.en);if(en===null)return;let cn=prompt('中文',w.cn);if(cn===null)return;let cat=prompt('分类',w.cat);if(cat===null||!en.trim()||!cn.trim())return;Object.assign(w,{en:en.trim(),cn:cn.trim(),cat:cat.trim()||'未分类'});save();page('library')}function removeWord(id){if(confirm('删除此单词？')){S.words=S.words.filter(w=>w.id!==id);if(S.task?.ids.includes(id))S.task=null;save();page('library')}}
function start(mode){if(S.task&&!confirm('已有未完成任务，是否替换？'))return;let c=$('studycat')?.value||'',n=Math.max(1,Math.min(100,Number($('count')?.value)||S.settings.count)),a=S.words.filter(w=>(!c||w.cat===c)&&(mode!=='wrong'||w.wrong>0)&&(mode!=='review'||(w.due&&w.due<=day())));if(!a.length)return alert('没有符合条件的单词，请先导入或选择其他模式。');for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S.task={mode,ids:a.slice(0,n).map(w=>w.id),i:0,correct:0,result:null,reveal:false};save();page('study')}
function renderTask(){let t=S.task,w=S.words.find(w=>w.id===t.ids[t.i]);if(!w){S.task=null;save();page('study');return}let rec=t.mode==='recognize',listen=t.mode==='listen';$('view').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><b>${rec?'单词认读':listen?'听音拼写':'单词拼写'}</b><small>${t.i+1} / ${t.ids.length}</small></div><div class="bar"><i style="width:${t.i/t.ids.length*100}%"></i></div><div class="center"><p>${rec?'回忆中文意思':listen?'听发音，写出英文':'根据中文写出英文'}</p><div class="prompt">${rec?esc(w.en):listen?'🎧':esc(w.cn)}</div>${rec||listen?`<button class="alt" onclick="sayWord('${w.id}')">🔊 播放发音</button>`:''}${!rec&&S.settings.hints?`<p>${w.en.length} 个字符</p>`:''}</div>${rec?(t.reveal?`<div class="center"><h2>${esc(w.cn)}</h2><div class="row" style="justify-content:center"><button class="danger" onclick="grade(false,0)">忘记</button><button class="alt" onclick="grade(false,1)">模糊</button><button onclick="grade(true,2)">认识</button></div></div>`:'<button onclick="S.task.reveal=true;save();renderTask()">显示释义</button>'):(t.result?`<div class="center"><h2 class="${t.result.ok?'good':'bad'}">${t.result.ok?'Excellent! 拼写正确':'正确答案：'+esc(w.en)}</h2><p>你的答案：${esc(t.result.answer)}</p><button class="alt" onclick="sayWord('${w.id}')">🔊 朗读</button></div>${t.result.ok?'<button id="next" onclick="next()">下一题</button>':'<form id="retry"><p>请正确拼写一次后继续</p><input id="answer" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" required><button>继续</button></form>'}`:`<form id="quiz"><input id="answer" placeholder="输入英文单词" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" required><div class="row"><button>检查答案</button><button type="button" class="alt" onclick="showHint()">提示</button></div><p id="hint"></p></form>`)}<hr style="border:0;border-top:1px solid #eee"><button class="alt" onclick="page('home')">稍后继续</button> <button class="alt" onclick="if(confirm('结束当前任务？已完成题目仍保留。')){S.task=null;save();page('study')}">结束任务</button></div>`;if($('quiz')){$('quiz').onsubmit=e=>{e.preventDefault();let a=$('answer').value.trim();grade(a.toLowerCase()===w.en.toLowerCase(),null,a)};$('answer').focus()}if($('retry')){$('retry').onsubmit=e=>{e.preventDefault();if($('answer').value.trim().toLowerCase()===w.en.toLowerCase())next();else alert('再试一次：'+w.en)};$('answer').focus()}$('next')?.focus()}
function showHint(){let w=S.words.find(w=>w.id===S.task.ids[S.task.i]);$('hint').textContent=w.en[0]+' '+ '· '.repeat(Math.max(0,w.en.length-1))}function grade(ok,r,a=''){let t=S.task;if(!t||t.result)return;let w=S.words.find(w=>w.id===t.ids[t.i]);S.logs.push({day:day(),id:w.id,ok,mode:t.mode});if(ok){t.correct++;w.level=Math.min(6,(w.level||0)+1)}else{w.wrong=(w.wrong||0)+1;w.level=0}let d=new Date();d.setDate(d.getDate()+(ok?[1,1,2,4,7,15,30][w.level]:1));w.due=d.toLocaleDateString('sv-SE');if(t.mode==='recognize'){w.recognize=(w.recognize||0)+(ok?1:0);next()}else{w.spell=(w.spell||0)+(ok?1:0);t.result={ok,answer:a};save();renderTask()}}function next(){let t=S.task;t.i++;t.result=null;t.reveal=false;if(t.i>=t.ids.length){let n=t.ids.length,c=t.correct;S.task=null;save();$('view').innerHTML=`<div class="card center"><h1>🌟 Great job!</h1><p>本次任务已完成</p><div class="prompt">${c} / ${n}</div><p>正确率 ${Math.round(c/n*100)}%</p><button onclick="page('home')">返回首页</button> <button class="alt" onclick="page('study')">新任务</button></div>`}else{save();renderTask()}}page('home');
const cloud=window.supabase.createClient('https://xqtjggjydoxwtgaquvmh.supabase.co','sb_publishable_UG7MvM_drG3MkkcGJ-lIDQ_nwpNs0hv');
let uid=null,version=null,dirty=false,busy=false,conflict=false,timer=null,ready=false;
const blank=()=>({words:[],logs:[],task:null,avatar:'',settings:{count:10,hints:false}});
function status(t){$('syncstatus').textContent=t}
function payload(){return {user_id:uid,profile:{avatar:S.avatar},words:S.words,learning_records:S.logs,mistakes:[],active_task:S.task||{},settings:S.settings,updated_at:new Date().toISOString()}}
let deferredRemote=null;function apply(r){S={words:r.words||[],logs:r.learning_records||[],task:r.active_task?.ids?r.active_task:null,avatar:r.profile?.avatar||'',settings:{...blank().settings,...r.settings}};version=r.updated_at;deferredRemote=null;avatar();page(current);}
function editing(){return current==='study'&&!!S.task||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&$('view').contains(document.activeElement)}
function canonical(v){if(Array.isArray(v))return v.map(canonical);if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])]));return v}function sameLearning(r){return JSON.stringify(canonical([S.words,S.logs,S.task,S.settings]))===JSON.stringify(canonical([r.words||[],r.learning_records||[],r.active_task?.ids?r.active_task:null,{...blank().settings,...r.settings}]))}
async function pull(force=false){if(!uid||!ready||busy||dirty||conflict)return;busy=true;try{const {data,error}=await cloud.from('tangtang_learning').select('*').eq('user_id',uid).maybeSingle();if(error)throw error;if(dirty)return;if(data&&data.updated_at!==version){if(sameLearning(data)){S.avatar=data.profile?.avatar||'';version=data.updated_at;deferredRemote=null;avatar()}else if(!force&&editing()){deferredRemote=data;S.avatar=data.profile?.avatar||'';avatar();status('头像已更新；学习数据待安全刷新');return}else apply(data)}status('已同步');}catch(e){status('读取失败：'+e.message)}finally{busy=false;if(dirty&&!conflict){clearTimeout(timer);timer=setTimeout(flush,150)}}}
function save(immediate=false){if(!ready)return;dirty=true;try{localStorage.setItem('tt-pending-'+uid,JSON.stringify({state:S,version}))}catch{}status('正在保存…');clearTimeout(timer);if(immediate)void flush();else timer=setTimeout(flush,150)}
async function flush(){if(!uid||!ready||busy||!dirty||conflict)return;busy=true;dirty=false;let p=payload();try{let q=version?cloud.from('tangtang_learning').update(p).eq('user_id',uid).eq('updated_at',version):cloud.from('tangtang_learning').insert(p);let {data,error}=await q.select('updated_at').maybeSingle();if(error){if(error.code==='23505')conflict=true;throw error}if(!data){conflict=true;throw Error('另一设备已修改数据')}version=data.updated_at;if(!dirty)localStorage.removeItem('tt-pending-'+uid);else localStorage.setItem('tt-pending-'+uid,JSON.stringify({state:S,version}));status(dirty?'正在保存…':'已同步');}catch(e){dirty=true;status(conflict?'同步冲突：请导出备份后重新载入云端':'保存失败，可点击同步重试：'+e.message)}finally{busy=false;if(dirty&&!conflict){clearTimeout(timer);timer=setTimeout(flush,version===p.updated_at?150:5000)}}}
async function enter(user){uid=user.id;ready=false;dirty=false;conflict=false;version=null;deferredRemote=null;S=blank();$('login').hidden=true;$('workspace').hidden=false;$('workspace').inert=true;status('读取云端…');try{let {data,error}=await cloud.from('tangtang_learning').select('*').eq('user_id',uid).maybeSingle();if(error)throw error;let pending;try{pending=JSON.parse(localStorage.getItem('tt-pending-'+uid))}catch{}if(data)apply(data);else {let old;try{old=JSON.parse(localStorage.getItem('ttwords-v1'))}catch{}if(old&&confirm('是否将此浏览器旧版学习数据导入云端？'))S=old;avatar();page('home')}ready=true;$('workspace').inert=false;if(pending){if(pending.version===version){S=pending.state;avatar();page(current);save()}else{download('未同步学习备份.json',JSON.stringify(pending.state));localStorage.removeItem('tt-pending-'+uid);alert('旧的未同步数据已导出备份，保留云端版本。')}}else if(!data)save();else status('已同步')}catch(e){$('login').hidden=false;$('workspace').hidden=true;$('loginmsg').textContent='读取失败：'+e.message;uid=null}}
$('loginform').onsubmit=async e=>{e.preventDefault();$('loginmsg').textContent='登录中…';try{let {data,error}=await cloud.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;$('password').value='';await enter(data.user)}catch(e){$('loginmsg').textContent=e.message}};
$('syncnow').onclick=async()=>{if(conflict){if(confirm('导出当前数据并重新载入云端版本？')){download('冲突备份.json',JSON.stringify(S));localStorage.removeItem('tt-pending-'+uid);dirty=false;conflict=false;await pull()}return}if(dirty)await flush();else await pull(!editing()||confirm('云端同步可能刷新当前练习，是否继续？'))};
$('logout').onclick=async()=>{if(busy)return alert('同步正在进行');if(dirty){await flush();if(dirty)return alert('尚未同步，请先处理保存问题')}await cloud.auth.signOut();uid=null;ready=false;S=blank();$('workspace').hidden=true;$('login').hidden=false;$('loginmsg').textContent='已退出';};
function syncTick(){if(!ready||busy||conflict||document.hidden)return;if(dirty)flush();else pull()}setInterval(syncTick,5000);window.addEventListener('focus',syncTick);document.addEventListener('visibilitychange',syncTick);window.addEventListener('online',syncTick);window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue=''}});cloud.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user)}).catch(e=>{$('loginmsg').textContent=e.message});
